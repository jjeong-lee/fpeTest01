      - system_enabled와 업무 역할만 변경할 수 있다
      x-side-effects:
      - user_account의 system_enabled를 저장한다
      - 변경 전후 값을 change_history에 기록한다
      x-required-tests:
      - 'happy: 유효한 R09 요청 -> user_account의 system_enabled 변경을 후속 GET으로 확인'
      - 'auth: R09 이외의 인증 사용자 요청 -> 403과 user_account 미변경'
