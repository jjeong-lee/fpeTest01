components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
      description: HttpOnly SameSite=Lax 세션 cookie
  schemas:
    AccountStatus:
      type: string
      enum:
      - ACTIVE
      - INACTIVE
    EmploymentStatus:
      type: string
      enum:
      - ACTIVE
      - RETIRED
    OrganizationType:
      type: string
      enum:
      - UNIVERSITY
      - GRADUATE_SCHOOL
      - COLLEGE
      - DEPARTMENT
      - OFFICE
    AssignmentType:
      type: string
      enum:
      - POSITION_BASED
      - MANUAL
    UserRoleStatus:
      type: string
      enum:
      - ACTIVE
      - REVOKED
    MenuPermissionSubjectType:
      type: string
      enum:
      - ROLE
      - ORGANIZATION
      - USER
    AccessDecision:
      type: string
      enum:
      - ALLOW
      - DENY
    UseStatus:
      type: string
      enum:
      - ACTIVE
      - INACTIVE
    SessionStatus:
      type: string
      enum:
      - ACTIVE
      - INVALIDATED
      - EXPIRED
    ApiResponse:
      type: object
      required:
      - success
      - meta
      properties:
        success:
          type: boolean
          enum:
          - true
        data: {}
        meta:
          type: object
          additionalProperties: true
    ApiError:
      type: object
      required:
      - success
      - meta
      properties:
        success:
          type: boolean
          enum:
          - false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            fieldErrors:
              type: array
              items:
                type: object
        meta:
          type: object
          additionalProperties: true
    LoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
        password:
          type: string
    UserSystemSettingsRequest:
      type: object
      required:
      - systemEnabled
      properties:
        systemEnabled:
