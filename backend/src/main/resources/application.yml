spring:
  application:
    name: faculty-achievement-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/faculty_achievement}
    username: ${DATABASE_USERNAME:faculty_achievement}
    password: ${DATABASE_PASSWORD:faculty_achievement}
  flyway:
    enabled: true
    locations: classpath:db/migration
mybatis:
  mapper-locations: classpath:mappers/*.xml
  type-handlers-package: kr.ac.knue.achievement.common
server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
